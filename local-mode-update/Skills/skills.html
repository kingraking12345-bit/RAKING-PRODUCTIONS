<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <script src="../index/rp-config.js"></script><script src="../index/rp-backend.js"></script><script src="../index/rp-site-loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills | Raking Productions</title>
<style>
:root{--bg:#07111f;--panel:#0c1b2e;--panel2:#12243b;--cyan:#2ee6e6;--blue:#3b82f6;--green:#34d399;--text:#d7e6ff;--muted:#8ba0bd;--border:#25415e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'Segoe UI',Arial,sans-serif;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid var(--border);background:#091729;position:sticky;top:0}header strong{font-size:1.1rem;color:var(--cyan)}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;padding:9px 13px;background:var(--panel2);color:var(--text);text-decoration:none;font:inherit;cursor:pointer}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04101f;font-weight:700}main{max-width:1040px;margin:auto;padding:30px 20px 60px}.intro{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:12px 0 24px;border-bottom:1px solid var(--border)}h1{font-size:2rem;margin:0 0 8px}p{color:var(--muted);line-height:1.55;margin:0}.notice{font-size:.82rem;color:#a9bad1;margin-top:8px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.metric{padding:15px 16px;background:var(--panel);border-left:3px solid var(--cyan)}.metric strong{display:block;font-size:1.35rem}.metric span{color:var(--muted);font-size:.8rem}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.toolbar h2{font-size:1.1rem;margin:0}.toolbar select,.toolbar input,.custom-form input{background:var(--panel);color:var(--text);border:1px solid var(--border);padding:9px 10px;border-radius:6px;font:inherit}.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.path{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px}.path-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.path h3{margin:0 0 5px;font-size:1rem}.path p{font-size:.86rem}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin:14px 0 6px}.bar{height:6px;background:#071525;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);transition:width .2s}.modules{list-style:none;padding:0;margin:12px 0 0}.modules li{border-top:1px solid var(--border);padding:10px 0}.modules label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}.modules input{accent-color:var(--green);margin-top:3px}.module-name{font-weight:600}.module-detail{display:block;color:var(--muted);font-size:.8rem}.custom-form{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.custom-form input{flex:1 1 180px}.empty{grid-column:1/-1;border:1px dashed var(--border);padding:24px;color:var(--muted);text-align:center}@media(max-width:640px){header{position:static}.summary{grid-template-columns:1fr 1fr}.intro{align-items:start;flex-direction:column}}
</style>
<link rel="stylesheet" href="../index/rp-ui.css"><script src="../index/rp-ui.js"></script></head>
<body>
<header><strong>RAKING PRODUCTIONS <span style="color:var(--text);font-weight:400">/ Skills</span></strong><a class="btn" href="../index/index.html">← Branches</a></header>
<main>
<div class="intro"><div><h1>Skills</h1><p>Choose a learning path, work through its milestones, and keep a record of what you have practiced.</p><div class="notice">Progress is saved in this browser and can be reset by clearing browser storage.</div></div></div>
<div class="summary" aria-live="polite"><div class="metric"><strong id="completedCount">0</strong><span>Milestones completed</span></div><div class="metric"><strong id="totalCount">0</strong><span>Total milestones</span></div><div class="metric"><strong id="pathCount">0</strong><span>Learning paths</span></div></div>
<div class="toolbar"><h2>Learning paths</h2><select id="categoryFilter" aria-label="Filter learning paths"><option value="all">All paths</option><option value="science">Science</option><option value="technology">Technology</option><option value="creative">Creative</option><option value="custom">My paths</option></select></div>
<form id="customForm" class="custom-form"><input id="pathName" maxlength="70" placeholder="Create a learning path" required aria-label="Learning path name"><select id="pathCategory" aria-label="Path category"><option value="science">Science</option><option value="technology">Technology</option><option value="creative">Creative</option></select><button class="btn primary" type="submit">Add path</button></form>
<div class="paths" id="paths"></div>
</main>
<script>
const key='rp-skills-progress-v1';
const defaults=[
 {id:'research',name:'Research Foundations',category:'science',description:'Practice asking answerable questions and building evidence-based investigations.',modules:[['Form a research question','Turn a broad topic into a focused, testable question.'],['Write a hypothesis','State a prediction and explain the reasoning behind it.'],['Plan a fair test','Identify variables, controls, materials, and a repeatable procedure.'],['Evaluate evidence','Separate observations from interpretations and note limitations.']]},
 {id:'data',name:'Data & Analysis',category:'science',description:'Develop reliable habits for measurement, uncertainty, and communicating results.',modules:[['Organize observations','Choose clear labels, units, and a consistent table structure.'],['Summarize repeated trials','Calculate a mean and describe variation between runs.'],['Visualize results','Select a graph that matches the variables and question.'],['Review uncertainty','Record instrument resolution and plausible sources of error.']]},
 {id:'coding',name:'Coding Projects',category:'technology',description:'Build small, testable software projects from an idea to a finished result.',modules:[['Break down a goal','Write the smallest useful steps before implementing.'],['Build a first version','Implement one complete behavior at a time.'],['Test edge cases','Check empty, unusual, and invalid inputs.'],['Document and share','Explain setup, behavior, and known limitations.']]},
 {id:'design',name:'Creative Practice',category:'creative',description:'Strengthen a repeatable process for making, reviewing, and refining creative work.',modules:[['Collect references','Gather relevant examples and note what you learn from them.'],['Create a first draft','Make a complete initial version without polishing every detail.'],['Request feedback','Ask focused questions and record useful responses.'],['Revise with intent','Make changes that support the goal of the work.']]}
];
function load(){try{const value=JSON.parse(localStorage.getItem(key)||'{}');if(value&&Array.isArray(value.custom))return value;return {done:{},custom:[]}}catch{return {done:{},custom:[]}}}
let state=load();state.done=state.done||{};state.custom=state.custom||[];
function save(){localStorage.setItem(key,JSON.stringify(state))}
function allPaths(){return [...defaults,...state.custom]}
function render(){const category=document.getElementById('categoryFilter').value;const items=allPaths().filter(path=>category==='all'||(category==='custom'?path.custom===true:path.category===category));const root=document.getElementById('paths');root.replaceChildren();let completed=0,total=0;for(const path of allPaths()){for(let i=0;i<path.modules.length;i++){total++;if(state.done[`${path.id}:${i}`])completed++}}document.getElementById('completedCount').textContent=completed;document.getElementById('totalCount').textContent=total;document.getElementById('pathCount').textContent=allPaths().length;if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No paths in this category yet.';root.append(empty);return}for(const path of items){const card=document.createElement('article');card.className='path';const head=document.createElement('div');head.className='path-head';const title=document.createElement('h3');title.textContent=path.name;head.append(title);if(path.custom){const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.textContent='Remove';remove.setAttribute('aria-label',`Remove ${path.name}`);remove.addEventListener('click',()=>{state.custom=state.custom.filter(item=>item.id!==path.id);for(const savedKey of Object.keys(state.done)){if(savedKey.startsWith(`${path.id}:`))delete state.done[savedKey]}save();render()});head.append(remove)}const description=document.createElement('p');description.textContent=path.description;const doneCount=path.modules.reduce((n,_,i)=>n+(state.done[`${path.id}:${i}`]?1:0),0);const progress=document.createElement('div');progress.className='progress-label';const progressText=document.createElement('span');progressText.textContent='Progress';const fraction=document.createElement('span');fraction.textContent=`${doneCount} / ${path.modules.length}`;progress.append(progressText,fraction);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=`${path.modules.length?doneCount/path.modules.length*100:0}%`;bar.append(fill);const list=document.createElement('ul');list.className='modules';path.modules.forEach(([name,detail],i)=>{const li=document.createElement('li');const label=document.createElement('label');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=!!state.done[`${path.id}:${i}`];checkbox.addEventListener('change',()=>{state.done[`${path.id}:${i}`]=checkbox.checked;save();render()});const text=document.createElement('span');const strong=document.createElement('span');strong.className='module-name';strong.textContent=name;const note=document.createElement('span');note.className='module-detail';note.textContent=detail;text.append(strong,note);label.append(checkbox,text);li.append(label);list.append(li)});card.append(head,description,progress,bar,list);root.append(card)}}
document.getElementById('categoryFilter').addEventListener('change',render);
document.getElementById('customForm').addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('pathName').value.trim();if(!name)return;state.custom.push({id:`custom-${Date.now()}`,name,category:document.getElementById('pathCategory').value,description:'A personal learning path. Add milestones by practicing and recording your progress.',custom:true,modules:[['Set a learning goal','Describe what you want to be able to do.'],['Practice the skill','Work through a focused exercise or small project.'],['Review your progress','Note what improved and what to practice next.']]});save();event.target.reset();document.getElementById('categoryFilter').value='custom';render()});
render();
</script>
<script src="skills-branch.js"></script>
<script src="../index/kit-bar.js" defer></script>
</body>
</html>
