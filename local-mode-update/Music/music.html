<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <script src="../index/rp-config.js"></script><script src="../index/rp-backend.js"></script><script src="../index/rp-site-loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raking Production for Music</title>
<style>
:root{
  --bg:#050b16; --panel:#0c1830; --panel2:#10203f; --cyan:#2ee6e6; --blue:#3b82f6;
  --green:#34d399; --red:#f87171; --text:#d7e6ff; --muted:#7d93b8; --border:#1e3a63;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#0a1830 0%,var(--bg) 60%);color:var(--text);min-height:100vh;}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#071125 0%,rgba(7,17,37,.9) 100%);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;backdrop-filter:blur(6px);}
header h1{font-size:1.3rem;margin:0;color:var(--cyan);text-shadow:0 0 12px rgba(46,230,230,.35);}
header h1 span{color:var(--text);font-weight:400;font-size:.9rem;display:block;margin-top:2px;}
.balance{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--cyan);padding:8px 16px;border-radius:30px;font-weight:bold;color:var(--cyan);}
nav{display:flex;gap:8px;padding:14px 20px 0 20px;flex-wrap:wrap;}
nav button{flex:1 1 auto;min-width:100px;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:12px 10px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;}
nav button.active{color:var(--bg);background:linear-gradient(135deg,var(--cyan),var(--blue));border-color:transparent;}
main{padding:20px;max-width:1000px;margin:0 auto;}
section{display:none;background:var(--panel);border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:20px;}
section.active{display:block;}
h2{margin-top:0;color:var(--cyan);}
p.subtitle{color:var(--muted);margin-top:-6px;font-size:.9rem;}
.chip-grid,.store-grid{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;}
.chip .label-col{display:flex;flex-direction:column;line-height:1.2;}
.chip .formula{font-size:.72rem;color:var(--muted);}
.chip .count{background:rgba(46,230,230,.15);color:var(--cyan);border-radius:8px;padding:1px 7px;font-size:.78rem;font-weight:bold;}
.chip.selected{border-color:var(--cyan);background:linear-gradient(135deg,rgba(46,230,230,.18),rgba(59,130,246,.12));}
.empty-msg{color:var(--muted);font-style:italic;padding:10px 0;}
.btn{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04101f;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer;}
.btn.secondary{background:var(--panel2);color:var(--cyan);border:1px solid var(--cyan);}
.result-box{margin-top:18px;padding:16px 18px;border-radius:10px;border-left:4px solid var(--cyan);background:var(--panel2);line-height:1.5;}
.result-box.warn{border-left-color:var(--red);}
.result-box.success{border-left-color:var(--green);}
.store-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;}
.store-card .emoji{font-size:2rem;display:block;margin-bottom:6px;}
.store-card .name{font-weight:600;font-size:.95rem;min-height:2.4em;}
.store-card .formula{color:var(--muted);font-size:.78rem;}
.store-card .state-badge{display:inline-block;margin-top:4px;background:rgba(46,230,230,.12);color:var(--cyan);border-radius:6px;padding:1px 7px;font-size:.7rem;text-transform:uppercase;}
.store-card .price{color:var(--cyan);font-weight:bold;margin:6px 0 10px;}
.store-card button{width:100%;}
.store-card .custom-tag{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04101f;font-size:.65rem;font-weight:bold;padding:2px 6px;border-radius:6px;}
.store-card .delete-btn{position:absolute;top:8px;left:8px;background:none;border:none;color:var(--red);font-size:.9rem;cursor:pointer;}
.create-panel{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:18px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0;}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);}
.form-grid input,.form-grid select,.form-grid textarea{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:8px;font-family:inherit;font-size:.9rem;}
.form-grid input[type=range]{accent-color:var(--cyan);padding:0;}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;}
.emoji-picker button{background:var(--panel);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;padding:6px 8px;cursor:pointer;}
.emoji-picker button.picked{border-color:var(--cyan);background:rgba(46,230,230,.15);}
.quiz-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.options{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.option{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;}
.option.correct{border-color:var(--green);background:rgba(52,211,153,.15);}
.option.wrong{border-color:var(--red);background:rgba(248,113,113,.15);}
.earn-summary{margin-top:10px;padding:14px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--cyan);display:none;}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 10px 40px;}
.situation-row{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;position:relative;}
.situation-row .situation-label{font-size:.78rem;color:var(--cyan);font-weight:600;margin-bottom:6px;display:block;}
.situation-row textarea{width:100%;}
.situation-row .remove-situation-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--cyan);color:var(--text);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:100;max-width:90%;text-align:center;}

/* ---------- Raking Productions loading + branch select ---------- */
#loadingScreen,#branchSelectScreen{
  position:fixed; inset:0; z-index:200;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%, #0a1830 0%, var(--bg) 70%);
  padding:20px; text-align:center;
}
#gamesBranchScreen{
  position:fixed; inset:0; z-index:200; overflow-y:auto;
}
.rp-logo{
  font-size:2.4rem; font-weight:800; letter-spacing:2px; color:var(--text);
  text-shadow:0 0 20px rgba(46,230,230,.25); margin-bottom:28px;
}
.rp-logo span{ color:var(--cyan); display:block; font-size:1.1rem; letter-spacing:6px; font-weight:600; margin-top:4px; }
.rp-logo.small{ font-size:1.5rem; margin-bottom:16px; }
.rp-logo.small span{ font-size:0.8rem; letter-spacing:4px; }
.rp-loading-bar-track{ width:min(320px,80vw); height:8px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.rp-loading-bar-fill{ height:100%; width:0%; background:linear-gradient(135deg,var(--cyan),var(--blue)); border-radius:6px; transition:width 0.15s linear; }
.rp-loading-text{ margin-top:14px; color:var(--muted); font-size:0.85rem; letter-spacing:1px; }
.rp-subheading{ color:var(--text); font-weight:600; margin:0 0 24px 0; font-size:1.15rem; }
.branch-grid{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:720px; }
.branch-card{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:28px 24px; width:260px; cursor:pointer; transition:all .2s ease; position:relative;
}
.branch-card:hover{ border-color:var(--cyan); transform:translateY(-4px); box-shadow:0 8px 24px rgba(46,230,230,.15); }
.branch-emoji{ font-size:2.6rem; display:block; margin-bottom:12px; }
.branch-title{ font-weight:700; font-size:1.05rem; color:var(--text); margin-bottom:8px; }
.branch-desc{ color:var(--muted); font-size:0.85rem; line-height:1.4; }
.branch-tag{
  display:inline-block; margin-top:14px; background:rgba(46,230,230,.12); color:var(--cyan);
  border-radius:8px; padding:3px 10px; font-size:0.72rem; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
}
#scienceLabApp header{ gap:14px; }
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Raking Productions for Games (Branch 2) ---------- */
  #gamesBranchScreen * { margin: 0; padding: 0; box-sizing: border-box; }
  #gamesBranchScreen {
    --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a26; --card: #1e1e2e;
    --border: rgba(255,255,255,0.08); --accent: #7c3aed; --accent2: #a855f7;
    --accent3: #c084fc; --text: #f1f0ff; --muted: #9ca3af;
    --gold: #f59e0b; --green: #10b981; --red: #ef4444; --blue: #3b82f6;
  }
  #gamesBranchScreen { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

  /* LOADER */
  #gamesBranchScreen #loader { position: fixed; inset: 0; background: #050508; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  #gamesBranchScreen .loader-logo { font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; }
  #gamesBranchScreen .loader-logo span { color: var(--accent2); }
  #gamesBranchScreen .spinner { width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(168,85,247,0.15); border-top-color: var(--accent2); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #gamesBranchScreen .loader-bar-wrap { width: 300px; display: none; }
  #gamesBranchScreen .loader-bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  #gamesBranchScreen .loader-bar-bg { height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
  #gamesBranchScreen .loader-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.3s ease; }
  #gamesBranchScreen .loader-status { font-size: 12px; color: rgba(168,85,247,0.7); letter-spacing: 2px; text-transform: uppercase; }

  /* NAV */
  #gamesBranchScreen #app { display: none; }
  #gamesBranchScreen nav { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 32px; height: 60px; gap: 8px; }
  #gamesBranchScreen .nav-logo { font-size: 1.1rem; font-weight: 800; color: var(--text); text-decoration: none; margin-right: 32px; white-space: nowrap; }
  #gamesBranchScreen .nav-logo span { color: var(--accent2); }
  #gamesBranchScreen .nav-links { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  #gamesBranchScreen .nav-btn { background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  #gamesBranchScreen .nav-btn:hover, #gamesBranchScreen .nav-btn.active { background: rgba(124,58,237,0.15); color: var(--text); }
  #gamesBranchScreen .btn-create { background: var(--accent); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  #gamesBranchScreen .btn-create:hover { background: var(--accent2); }

  /* PAGES */
  #gamesBranchScreen .page { display: none; min-height: calc(100vh - 60px); }
  #gamesBranchScreen .page.active { display: block; }

  /* HERO */
  #gamesBranchScreen .hero { background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.25) 0%, transparent 65%); padding: 80px 40px 60px; text-align: center; }
  #gamesBranchScreen .hero-badge { display: inline-block; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); color: var(--accent3); font-size: 12px; padding: 4px 14px; border-radius: 99px; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; }
  #gamesBranchScreen .hero h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 900; line-height: 1.1; letter-spacing: -2px; margin-bottom: 18px; }
  #gamesBranchScreen .hero h1 span { color: var(--accent2); }
  #gamesBranchScreen .hero p { font-size: 1.1rem; color: var(--muted); max-width: 560px; margin: 0 auto 36px; line-height: 1.7; }
  #gamesBranchScreen .hero-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #gamesBranchScreen .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  #gamesBranchScreen .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); }
  #gamesBranchScreen .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  #gamesBranchScreen .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }

  /* STATS */
  #gamesBranchScreen .stats { display: flex; gap: 1px; background: var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  #gamesBranchScreen .stat { flex: 1; background: var(--bg2); padding: 24px; text-align: center; }
  #gamesBranchScreen .stat-num { font-size: 1.8rem; font-weight: 800; color: var(--accent2); }
  #gamesBranchScreen .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  /* SECTION */
  #gamesBranchScreen .section { padding: 48px 40px; max-width: 1400px; margin: 0 auto; }
  #gamesBranchScreen .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  #gamesBranchScreen .section-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  #gamesBranchScreen .see-all { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  #gamesBranchScreen .see-all:hover { color: var(--text); border-color: rgba(168,85,247,0.4); }
  #gamesBranchScreen .games-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.3) transparent; }
  #gamesBranchScreen .games-row::-webkit-scrollbar { height: 4px; }
  #gamesBranchScreen .games-row::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 99px; }

  /* EMPTY STATE */
  #gamesBranchScreen .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; background: var(--card); border: 1px dashed rgba(168,85,247,0.25); border-radius: 16px; text-align: center; gap: 12px; width: 100%; }
  #gamesBranchScreen .empty-state .empty-icon { font-size: 2.5rem; }
  #gamesBranchScreen .empty-state p { color: var(--muted); font-size: 14px; }
  #gamesBranchScreen .empty-state button { background: rgba(124,58,237,0.2); border: 1px solid rgba(168,85,247,0.3); color: var(--accent3); font-size: 13px; padding: 8px 18px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  #gamesBranchScreen .empty-state button:hover { background: var(--accent); color: #fff; }

  /* GAME CARD */
  #gamesBranchScreen .game-card { min-width: 200px; max-width: 200px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: all 0.2s; flex-shrink: 0; text-decoration: none; display: block; }
  #gamesBranchScreen .game-card:hover { transform: translateY(-4px); border-color: rgba(168,85,247,0.4); }
  #gamesBranchScreen .game-thumb-placeholder { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
  #gamesBranchScreen .game-info { padding: 10px 12px; }
  #gamesBranchScreen .game-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  #gamesBranchScreen .game-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  #gamesBranchScreen .game-engine { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600; }
  #gamesBranchScreen .engine-godot { background: rgba(78,196,77,0.15); color: #4ec44d; border: 1px solid rgba(78,196,77,0.3); }
  #gamesBranchScreen .engine-unity { background: rgba(255,255,255,0.1); color: #ddd; border: 1px solid rgba(255,255,255,0.2); }
  #gamesBranchScreen .engine-unreal { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  #gamesBranchScreen .play-btn { font-size: 10px; background: var(--accent); color: #fff; border: none; padding: 3px 8px; border-radius: 6px; cursor: pointer; }

  /* ABOUT */
  #gamesBranchScreen .about-hero { background: radial-gradient(ellipse at 30% 50%, rgba(124,58,237,0.15) 0%, transparent 60%); padding: 64px 40px; }
  #gamesBranchScreen .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; max-width: 1200px; margin: 0 auto; align-items: center; }
  #gamesBranchScreen .about-badge { display: inline-block; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); color: var(--accent3); font-size: 11px; padding: 4px 12px; border-radius: 99px; margin-bottom: 16px; }
  #gamesBranchScreen .about-grid h2 { font-size: 2.4rem; font-weight: 900; letter-spacing: -1px; line-height: 1.2; margin-bottom: 16px; }
  #gamesBranchScreen .about-grid h2 span { color: var(--accent2); }
  #gamesBranchScreen .about-grid p { color: var(--muted); line-height: 1.8; margin-bottom: 16px; font-size: 15px; }
  #gamesBranchScreen .about-visual { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  #gamesBranchScreen .about-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  #gamesBranchScreen .about-card-icon { font-size: 2rem; margin-bottom: 10px; }
  #gamesBranchScreen .about-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  #gamesBranchScreen .about-card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  #gamesBranchScreen .team-section { padding: 48px 40px; max-width: 1200px; margin: 0 auto; }
  #gamesBranchScreen .team-section h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 32px; text-align: center; }
  #gamesBranchScreen .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  #gamesBranchScreen .team-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; text-align: center; transition: all 0.2s; }
  #gamesBranchScreen .team-card:hover { border-color: rgba(168,85,247,0.4); transform: translateY(-3px); }
  #gamesBranchScreen .team-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin: 0 auto 12px; color: white; }
  #gamesBranchScreen .team-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  #gamesBranchScreen .team-role { font-size: 12px; color: var(--accent3); }

  /* TUTORIALS */
  #gamesBranchScreen .tut-hero { padding: 48px 40px 24px; text-align: center; background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 60%); }
  #gamesBranchScreen .tut-hero h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
  #gamesBranchScreen .tut-hero p { color: var(--muted); font-size: 15px; }
  #gamesBranchScreen .tut-filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 24px 40px; }
  #gamesBranchScreen .filter-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 7px 16px; border-radius: 99px; cursor: pointer; transition: all 0.15s; }
  #gamesBranchScreen .filter-btn:hover, #gamesBranchScreen .filter-btn.active { background: rgba(124,58,237,0.2); border-color: rgba(168,85,247,0.5); color: var(--text); }
  #gamesBranchScreen .tut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 16px 40px 48px; max-width: 1400px; margin: 0 auto; }
  #gamesBranchScreen .tut-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
  #gamesBranchScreen .tut-card:hover { transform: translateY(-4px); border-color: rgba(168,85,247,0.4); }
  #gamesBranchScreen .tut-thumb { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3rem; position: relative; }
  #gamesBranchScreen .tut-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.4); }
  #gamesBranchScreen .tut-card:hover .tut-play { opacity: 1; }
  #gamesBranchScreen .tut-body { padding: 16px; }
  #gamesBranchScreen .tut-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }

<script>
let toastTimer = null;

/* ============================================================
   RAKING PRODUCTION FOR MUSIC — Branch 5 application logic
   ============================================================ */
let musicCtx = null;
function musicGetCtx(){
  if(!musicCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    musicCtx = new AC();
  }
  if(musicCtx.state === "suspended") musicCtx.resume();
  return musicCtx;
}

/* ---------- Drum sound synthesis (all generated, no audio files) ---------- */
function musicNoiseBuffer(ctx, duration){
  const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
  return buffer;
}
function musicPlayKick(ctx, time){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(0.01, time+0.4);
  gain.gain.setValueAtTime(1, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time+0.4);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(time); osc.stop(time+0.4);
}
function musicPlaySnare(ctx, time){
  const noise = ctx.createBufferSource();
  noise.buffer = musicNoiseBuffer(ctx, 0.2);
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = "highpass"; noiseFilter.frequency.value = 1000;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(1, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, time+0.2);
  noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(time); noise.stop(time+0.2);

  const osc = ctx.createOscillator();
  const oscGain = ctx.createGain();
  osc.type = "triangle"; osc.frequency.value = 180;
  oscGain.gain.setValueAtTime(0.7, time);
  oscGain.gain.exponentialRampToValueAtTime(0.01, time+0.12);
  osc.connect(oscGain); oscGain.connect(ctx.destination);
  osc.start(time); osc.stop(time+0.12);
}
function musicPlayHat(ctx, time, open){
  const dur = open ? 0.35 : 0.06;
  const noise = ctx.createBufferSource();
  noise.buffer = musicNoiseBuffer(ctx, dur);
  const filter = ctx.createBiquadFilter();
  filter.type = "highpass"; filter.frequency.value = 7000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.6, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time+dur);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(time); noise.stop(time+dur);
}
function musicPlayClap(ctx, time){
  for(let i=0;i<3;i++){
    const t = time + i*0.012;
    const noise = ctx.createBufferSource();
    noise.buffer = musicNoiseBuffer(ctx, 0.08);
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass"; filter.frequency.value = 1500;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t+0.08);
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    noise.start(t); noise.stop(t+0.08);
  }
}
function musicPlayTom(ctx, time){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(220, time);
  osc.frequency.exponentialRampToValueAtTime(80, time+0.3);
  gain.gain.setValueAtTime(0.8, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time+0.3);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(time); osc.stop(time+0.3);
}

  snare: (ctx,t) => musicPlaySnare(ctx,t),
  hihat: (ctx,t) => musicPlayHat(ctx,t,false),
  openhat: (ctx,t) => musicPlayHat(ctx,t,true),
  clap: (ctx,t) => musicPlayClap(ctx,t),
  tom: (ctx,t) => musicPlayTom(ctx,t)
};

/* ---------- Piano / synth voice ---------- */
function musicPlayNote(freq, voice){
  const ctx = musicGetCtx();
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  let filter = null;
  let duration = 0.9;

  if(voice === "bass"){
    osc.type = "sine";
    osc.frequency.value = freq / 2;
    duration = 1.1;
    gain.gain.setValueAtTime(0.9, t);
  } else if(voice === "lead"){
    osc.type = "sawtooth";
    osc.frequency.value = freq;
    duration = 0.5;
    filter = ctx.createBiquadFilter();
    filter.type = "lowpass"; filter.frequency.value = 3000;
    gain.gain.setValueAtTime(0.5, t);
  } else { // piano
    osc.type = "triangle";
    osc.frequency.value = freq;
    duration = 0.9;
    gain.gain.setValueAtTime(0.7, t);
  }
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(filter || gain);
  if(filter) filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

        <button class="mu-btn" id="musicPlayBtn">▶ Play</button>
        <button class="mu-btn secondary" id="musicClearBtn">✖ Clear</button>
        <span class="mu-bpm-label">Tempo: <strong id="musicBpmValue">${musicBpm}</strong> BPM</span>
        <input type="range" id="musicBpmSlider" min="60" max="180" value="${musicBpm}" style="width:160px;">
      </div>
    </div>
    <div class="mu-panel">
      <h2>🎹 Piano</h2>
      <p class="mu-sub">Click keys or use your computer keyboard (A S D F G H J K row) to play notes.</p>
      <div class="mu-voice-tabs" id="musicVoiceTabs">
        <button data-voice="piano" class="active">Piano</button>
        <button data-voice="bass">Bass</button>
        <button data-voice="lead">Lead Synth</button>
      </div>
      <div class="mu-piano" id="musicPiano"></div>
    </div>
  `;
  musicRenderSequencer();
  musicRenderPiano();
  document.getElementById("musicPlayBtn").addEventListener("click", musicToggleSequencer);
  document.getElementById("musicClearBtn").addEventListener("click", () => {
    musicPattern = musicDefaultPattern();
    Object.keys(musicPattern).forEach(k => musicPattern[k].fill(false));
    musicRenderSequencer();
  });
  const bpmSlider = document.getElementById("musicBpmSlider");
  bpmSlider.addEventListener("input", () => {
    musicBpm = parseInt(bpmSlider.value, 10);
    document.getElementById("musicBpmValue").textContent = musicBpm;
  });
  document.querySelectorAll("#musicVoiceTabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#musicVoiceTabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      musicCurrentVoice = btn.dataset.voice;
    });
  });
  musicAttachKeyboard();
}

function musicRenderSequencer(){
  const grid = document.getElementById("musicSeqGrid");
  if(!grid) return;
  grid.innerHTML = "";
  MUSIC_TRACKS_DEF.forEach(track => {
    const row = document.createElement("div");
    row.className = "mu-seq-row";
    row.innerHTML = `<span class="mu-seq-label">${track.emoji} ${track.name}</span>`;
    for(let i=0;i<MUSIC_STEPS;i++){
      const step = document.createElement("div");
      step.className = "mu-step" + (musicPattern[track.id][i] ? " on" : "") + (i % 4 === 0 ? " beat" : "");
      step.dataset.track = track.id;
      step.dataset.step = i;
      step.addEventListener("click", () => {
        musicPattern[track.id][i] = !musicPattern[track.id][i];
        step.classList.toggle("on");
      });
      row.appendChild(step);
    }
    grid.appendChild(row);
  });
}

function musicToggleSequencer(){
  const btn = document.getElementById("musicPlayBtn");
  if(musicPlaying){
    musicStopSequencer();
    btn.textContent = "▶ Play";
  } else {
    musicPlaying = true;
    musicCurrentStep = 0;
    btn.textContent = "⏸ Stop";
    musicSchedulerLoop();
  }
}
function musicStopSequencer(){
  musicPlaying = false;
  clearTimeout(musicSchedulerTimer);
  document.querySelectorAll("#musicSeqGrid .mu-step.playing").forEach(el => el.classList.remove("playing"));
  const btn = document.getElementById("musicPlayBtn");
  if(btn) btn.textContent = "▶ Play";
}
function musicSchedulerLoop(){
  if(!musicPlaying) return;
  const ctx = musicGetCtx();
  const stepTime = (60 / musicBpm) / 4; // 16th notes

  MUSIC_TRACKS_DEF.forEach(track => {
    if(musicPattern[track.id][musicCurrentStep]){
      MUSIC_DRUM_PLAYERS[track.id](ctx, ctx.currentTime);
    }
  });

  document.querySelectorAll("#musicSeqGrid .mu-step.playing").forEach(el => el.classList.remove("playing"));
  document.querySelectorAll(`#musicSeqGrid .mu-step[data-step="${musicCurrentStep}"]`).forEach(el => el.classList.add("playing"));

  musicCurrentStep = (musicCurrentStep + 1) % MUSIC_STEPS;
  musicSchedulerTimer = setTimeout(musicSchedulerLoop, stepTime * 1000);
}

/* ---------- Piano keyboard UI ---------- */
const MUSIC_OCTAVE_LAYOUT = [
  { note:"C", semis:0, white:true }, { note:"C#", semis:1, white:false },
  { note:"D", semis:2, white:true }, { note:"D#", semis:3, white:false },
  { note:"E", semis:4, white:true },
  { note:"F", semis:5, white:true }, { note:"F#", semis:6, white:false },
  { note:"G", semis:7, white:true }, { note:"G#", semis:8, white:false },
  { note:"A", semis:9, white:true }, { note:"A#", semis:10, white:false },
  { note:"B", semis:11, white:true }
];
const MUSIC_KEYMAP = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12 };

function musicRenderPiano(){
  const wrap = document.getElementById("musicPiano");
  wrap.innerHTML = "";
  const whiteKeys = [];
  MUSIC_OCTAVE_LAYOUT.forEach(k => { if(k.white) whiteKeys.push(k); });
  whiteKeys.push({ note:"C", semis:12, white:true }); // closing C

  whiteKeys.forEach(k => {
    const key = document.createElement("div");
    key.className = "mu-white-key";
    key.dataset.semis = k.semis;
    wrap.appendChild(key);
  });

  const whiteWidthPct = 100 / whiteKeys.length;
  let whiteIndex = 0;
  MUSIC_OCTAVE_LAYOUT.forEach(k => {
    if(k.white){ whiteIndex++; return; }
    const black = document.createElement("div");
    black.className = "mu-black-key";
    black.dataset.semis = k.semis;
    black.style.left = `calc(${whiteIndex * whiteWidthPct}% - 3%)`;
    wrap.appendChild(black);
  });

  wrap.querySelectorAll(".mu-white-key, .mu-black-key").forEach(el => {
    const trigger = () => {
      const semis = parseInt(el.dataset.semis, 10);
      musicPlayNote(musicNoteFreq(semis), musicCurrentVoice);
      el.classList.add("pressed");
      setTimeout(() => el.classList.remove("pressed"), 150);
    };
    el.addEventListener("mousedown", trigger);
    el.addEventListener("touchstart", e => { e.preventDefault(); trigger(); });
  });
}

let musicKeyboardHandler = null;
function musicAttachKeyboard(){
  if(musicKeyboardHandler) document.removeEventListener("keydown", musicKeyboardHandler);
  musicKeyboardHandler = (e) => {
    if(document.getElementById("musicPiano") === null) return;
    if(e.repeat) return;
    const semis = MUSIC_KEYMAP[e.key.toLowerCase()];
    if(semis === undefined) return;
    musicPlayNote(musicNoteFreq(semis), musicCurrentVoice);
    const keyEl = document.querySelector(`#musicPiano [data-semis="${semis}"]`);
    if(keyEl){ keyEl.classList.add("pressed"); setTimeout(() => keyEl.classList.remove("pressed"), 150); }
  };
  document.addEventListener("keydown", musicKeyboardHandler);
}

/* ---------- Showcase / submissions ---------- */
const MUSIC_TRACKS_STORAGE_KEY = "rp_music_tracks_v1";
let MUSIC_TRACKS = [];
function musicLoadTracks(){
  try{ MUSIC_TRACKS = JSON.parse(localStorage.getItem(MUSIC_TRACKS_STORAGE_KEY) || "[]"); } catch(e){ MUSIC_TRACKS = []; }
}
function musicSaveTracks(){
  try{ localStorage.setItem(MUSIC_TRACKS_STORAGE_KEY, JSON.stringify(MUSIC_TRACKS)); } catch(e){}
}

function musicGoShowcase(){
  musicStopSequencer();
  musicSetActiveNav("musicNavShowcase");
  document.getElementById("musicHero").style.display = "none";
  musicLoadTracks();
  const main = document.getElementById("musicMain");
  main.innerHTML = `
    <div class="mu-panel">
      <h2>📢 Track Showcase</h2>
      <p class="mu-sub">Tracks submitted by the community. Click "+ Submit Track" above to add your own.</p>
      <div class="mu-track-grid" id="musicTrackGrid"></div>
    </div>
  `;
  musicRenderTrackGrid();
}

function musicEmbedFor(link){
  try{
    const url = new URL(link);
    if(url.hostname.includes("youtube.com") || url.hostname.includes("youtu.be")){
      let videoId = "";
      if(url.hostname.includes("youtu.be")) videoId = url.pathname.slice(1);
      else videoId = url.searchParams.get("v") || "";
      if(videoId) return `<div class="mu-track-embed"><iframe width="100%" height="160" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
    }
    if(url.hostname.includes("soundcloud.com")){
      return `<div class="mu-track-embed"><iframe width="100%" height="120" scrolling="no" frameborder="no" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(link)}"></iframe></div>`;
    }
  } catch(e){}
  return "";
}

function musicRenderTrackGrid(){
  const grid = document.getElementById("musicTrackGrid");
  if(!grid) return;
  grid.innerHTML = "";
  if(MUSIC_TRACKS.length === 0){
    grid.innerHTML = `<div class="mu-empty">No tracks submitted yet — be the first! 🎧</div>`;
    return;
  }
  MUSIC_TRACKS.slice().reverse().forEach(track => {
    const card = document.createElement("div");
    card.className = "mu-track-card";
    const embed = musicEmbedFor(track.link);
    card.innerHTML = `
      <span class="mu-track-emoji">${track.emoji}</span>
      <div class="mu-track-title">${track.title}</div>
      <div class="mu-track-artist">by ${track.artist}</div>
      <span class="mu-track-genre">${track.genre}</span>
      ${embed || `<a class="mu-btn secondary" style="text-align:center; text-decoration:none;" href="${track.link}" target="_blank" rel="noopener">🔗 Listen</a>`}
    `;
    grid.appendChild(card);
  });
}

function musicOpenSubmit(){ document.getElementById("musicSubmitModal").classList.remove("hidden"); }
function musicCloseSubmit(){ document.getElementById("musicSubmitModal").classList.add("hidden"); }
function musicSubmitTrack(){
  const title = document.getElementById("msTitle").value.trim();
  const artist = document.getElementById("msArtist").value.trim();
  const genre = document.getElementById("msGenre").value;
  const link = document.getElementById("msLink").value.trim();
  const emoji = document.getElementById("msEmoji").value.trim() || "🎧";
  if(!title){ showToast("Please enter a track title."); return; }
  if(!artist){ showToast("Please enter an artist name."); return; }
  if(!link || !link.startsWith("http")){ showToast("Please enter a valid link starting with https://"); return; }

  musicLoadTracks();
  MUSIC_TRACKS.push({ id: Date.now(), title, artist, genre, link, emoji });
  musicSaveTracks();
  musicCloseSubmit();
  ["msTitle","msArtist","msLink","msEmoji"].forEach(id => document.getElementById(id).value = "");
  showToast(`🎉 "${title}" submitted to the Showcase!`);
  musicGoShowcase();
}


window.addEventListener("DOMContentLoaded", () => {
  initMusicBranch();
  document.getElementById("backToBranchesFromMusic").addEventListener("click", () => {
    musicStopSequencer();
    location.href = "../index/index.html";
  });
});
